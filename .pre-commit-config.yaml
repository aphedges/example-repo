minimum_pre_commit_version: 1.15.0
# `prek` `0.4.10` introduced `freeze` option
minimum_prek_version: 0.4.10
default_language_version:
  # Use latest LTS release
  node: 24.22.2
  # Use latest patch version of an actively supported release
  python: 3.14.9
update:
  freeze: true
  repos:
    "https://github.com/lycheeverse/lychee":
      exclude_tags: [nightly]
# Maintain _exact_ license contents for easier license detection
exclude: ^LICENSES/.*
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--unittest]
      - id: no-commit-to-branch
        args:
          # Prevent commit to default branch
          - --branch=main
          # Prevent characters in branch names that cause problems in shells
          - --pattern=.*[^\w./-].*
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/sirosen/texthooks
    rev: 18040afd19e75f525c1d42bc64a5805982f1c9d0 # frozen: 1.0.0
    hooks:
      - id: alphabetize-codeowners
      - id: fix-ligatures
      - id: fix-smartquotes
      - id: fix-spaces
      - id: fix-unicode-dashes
      - id: forbid-bidi-controls
  - repo: https://github.com/rbubley/mirrors-prettier # Use maintained fork of official mirror
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [
            --write,
            --indent=2,
            --case-indent, # Switch cases will be indented.
          ]
  - repo: https://github.com/typstyle-rs/pre-commit-typstyle
    rev: 4b63099824102a32da3f009f5a817f118cecd7ce # frozen: v0.15.2
    hooks:
      - id: typstyle
        args:
          - --inplace
          - --line-width=100
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-format
        args: [--exit-non-zero-on-fix]
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # frozen: v0.50.0
    hooks:
      - id: markdownlint
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
        args:
          - --fix=safe
          - --strict-collection
  - repo: https://github.com/pypa/dependency-groups
    rev: d21c4fb0b13dde29be98ecd63f9779018ca1bb26 # frozen: 1.3.2
    hooks:
      - id: lint-dependency-groups
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: local
    hooks:
      - id: just
        name: just
        language: system
        entry: just --fmt --justfile
        files: (?i)^\.?justfile$
        require_serial: true
      - id: mypy
        name: mypy
        language: system
        entry: mypy
        types:
          - python
        require_serial: true
      - id: pylint
        name: pylint
        language: system
        entry: pylint
        types:
          - python
        require_serial: true
  - repo: https://github.com/fsfe/reuse-tool
    rev: ea739bff9c6daa1c4c8a5c5dfd069f3fb0374728 # frozen: v6.3.0
    hooks:
      - id: reuse
  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # frozen: lychee-v0.24.2
    hooks:
      - id: lychee
        # Only run manually because it can have false positives and spurious failures
        stages: [manual]
